<html lang="en">

  <style>
html, body {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
  overflow: hidden;
  background: #fff4fb;
  font-family: -apple-system, BlinkMacSystemFont, "Avenir Next", "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

* { box-sizing: border-box; }
button { font: inherit; }

.app-shell {
  position: relative;
  width: 100%;
  height: 100%;
  min-height: 620px;
  overflow: hidden;
  color: #5b2851;
  background:
    radial-gradient(circle at 14% 12%, rgba(255,255,255,.95) 0 6%, transparent 7%),
    radial-gradient(circle at 88% 17%, rgba(255,255,255,.82) 0 4%, transparent 5%),
    linear-gradient(145deg, #fff5fb 0%, #f8e7ff 48%, #e8f8ff 100%);
}

.sky-shape {
  position: absolute;
  border-radius: 50%;
  filter: blur(1px);
  opacity: .55;
  pointer-events: none;
}
.sky-one { width: 330px; height: 330px; background: #ffd6e9; left: -140px; top: 90px; }
.sky-two { width: 420px; height: 420px; background: #d9efff; right: -210px; bottom: -120px; }

.sparkle {
  position: absolute;
  z-index: 1;
  color: rgba(255, 105, 180, .55);
  pointer-events: none;
  animation: twinkle 2.8s ease-in-out infinite;
}
.sparkle-a { left: 4%; top: 18%; font-size: 30px; }
.sparkle-b { right: 8%; top: 28%; font-size: 24px; animation-delay: .8s; }
.sparkle-c { right: 23%; bottom: 11%; font-size: 26px; animation-delay: 1.4s; }

@keyframes twinkle {
  0%,100% { transform: scale(.8) rotate(0); opacity: .25; }
  50% { transform: scale(1.18) rotate(12deg); opacity: .9; }
}

.topbar {
  position: relative;
  z-index: 3;
  height: 122px;
  padding: 26px 34px 12px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.title-block { min-width: 0; }
.greeting {
  display: inline-block;
  margin-bottom: 4px;
  padding: 5px 11px;

  color: #7d3565;
  background: rgba(255,255,255,.72);
  box-shadow: 0 5px 14px rgba(109, 48, 93, .08);
  font-size: 15px;
  font-weight: 800;
}
h1 {
  margin: 0;
  color: #7a2f67;
  font-size: 36px;
  line-height: 1.05;

}
.subtitle {
  margin-top: 5px;
  font-size: 17px;

}
.grownup-heart {

  height: 56px;

  border-radius: 50%;

}
.grownup-heart:active { transform: scale(.94); }

.home-grid {
  position: relative;
  z-index: 2;
  height: calc(100% - 178px);
  padding: 8px 28px 18px;
  display: grid;
  grid-template-columns: 1.65fr 1fr 1fr;
  grid-template-rows: 1fr 1fr;
  gap: 16px;
}

.activity-card {
  position: relative;

  border-radius: 28px;
  padding: 18px;
  color: #5b2851;

}
.activity-card:active {
  transform: translateY(2px) scale(.985);
  box-shadow: 0 6px 14px rgba(87, 41, 80, .13), inset 0 2px 0 rgba(255,255,255,.75);
}
.activity-card strong {
  display: block;
  margin-top: 6px;

}
.activity-card > span {
  display: block;
  margin-top: 7px;
  color: rgba(81, 40, 75, .75);
  font-size: 15px;
  font-weight: 700;
}
.tile-icon {
  width: 62px;
  height: 62px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 20px;

}

.theatre-card {
  grid-row: 1 / 3;
  display: flex;
  flex-direction: column;
  justify-content: flex-end;

}
.theatre-card .card-glow {
  position: absolute;

  height: 260px;

}
.card-copy { position: relative; z-index: 2; }

.card-copy > span { color: rgba(255,255,255,.9); }
.card-copy .eyebrow {
  display: inline-block;
  width: auto;
  margin: 0 0 6px;
  padding: 6px 10px;
  border-radius: 999px;
  color: #7b2e62;
  background: rgba(255,255,255,.86);
  font-size: 13px;
  font-weight: 900;
  letter-spacing: .15px;
}

.theatre-art {
  position: absolute;
  left: 16px;
  right: 16px;
  top: 16px;
  height: 58%;
}
.castle {
  position: absolute;
  left: 50%;
  bottom: 5px;
  width: 220px;
  height: 185px;
  transform: translateX(-50%);

}

}
.tower span {
  position: absolute;
  left: 50%;

  height: 0;

  border-right: 34px solid transparent;
  border-bottom: 48px solid #7f4bb4;
}
.tower-left { left: 2px; width: 70px; height: 105px; }
.tower-main { left: 59px; width: 103px; height: 142px; z-index: 2; }
.tower-main span { border-left-width: 48px; border-right-width: 48px; border-bottom-width: 62px; top: -51px; }
.tower-right { right: 2px; width: 70px; height: 105px; }
.castle-door {
  position: absolute;
  z-index: 3;
  left: 50%;
  bottom: 0;
  width: 48px;
  height: 67px;
  transform: translateX(-50%);
  border-radius: 24px 24px 5px 5px;
  color: #fff4fb;
  background: #b666bd;
  text-align: center;
  line-height: 53px;
  font-size: 19px;
}
.play-bubble {
  position: absolute;
  right: 8px;
  bottom: 16px;
  width: 68px;
  height: 68px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  color: #f75ca1;
  background: #fff;
  box-shadow: 0 8px 18px rgba(69, 22, 70, .22);
  font-size: 30px;
  padding-left: 4px;
  animation: pulsePlay 2.2s ease-in-out infinite;
}
@keyframes pulsePlay { 0%,100% { transform: scale(1); } 50% { transform: scale(1.08); } }

.dress-card { background: linear-gradient(145deg, #ffe5f2, #ffd0e7); }
.story-card { background: linear-gradient(145deg, #efe5ff, #ded1ff); }
.colour-card { background: linear-gradient(145deg, #fff0cd, #ffe3a5); }
.dance-card { background: linear-gradient(145deg, #dff8ff, #c7ebff); }
.calm-card { background: linear-gradient(145deg, #e7fff1, #ccf4df); }

.footer-strip {
  position: absolute;
  z-index: 4;
  left: 28px;
  right: 28px;
  bottom: 8px;
  height: 30px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  border-radius: 999px;
  color: #8d5c83;
  background: rgba(255,255,255,.65);
  font-size: 14px;
  font-weight: 800;
  box-shadow: 0 4px 12px rgba(77, 34, 74, .07);
}
.footer-star { color: #f279b0; }

.modal {
  position: fixed;
  z-index: 50;
  top: 0;
  right: 0;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  background: rgba(64, 35, 67, .44);
  -webkit-backdrop-filter: blur(8px);
  backdrop-filter: blur(8px);
}
.hidden { display: none !important; }
.modal-panel {
  position: relative;
  width: 94%;
  max-width: 930px;
  height: 90%;
  max-height: 700px;
  overflow: hidden;
  border: 5px solid rgba(255,255,255,.72);
  border-radius: 34px;
  background: #fff9fd;
  box-shadow: 0 24px 60px rgba(43, 21, 45, .34);
}
.close-button {
  position: absolute;
  z-index: 10;
  top: 13px;
  right: 13px;
  width: 58px;
  height: 58px;
  border: 0;
  border-radius: 50%;
  color: #fff;
  background: #ee5b9d;
  box-shadow: 0 7px 16px rgba(145,45,95,.28);
  font-size: 40px;
  line-height: 50px;

}
.modal-content {
  position: relative;
  width: 100%;
  height: 100%;
  padding: 25px 26px 22px;
  overflow: auto;
  -webkit-overflow-scrolling: touch;
}
.modal-heading {
  margin: 2px 76px 6px 0;
  color: #71305f;
  font-size: 34px;
  line-height: 1.1;
}
.modal-subtitle {
  margin: 0 80px 20px 0;
  color: #8c7188;
  font-size: 17px;
  font-weight: 700;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}
.video-card {
  border: 0;
  border-radius: 20px;

  padding: 0;
  color: #642c56;
  background: #fff;
  box-shadow: 0 8px 18px rgba(82,36,75,.12);

}
.video-card img { width: 100%; display: block; aspect-ratio: 16 / 9; object-fit: cover; background: #f8d9e9; }
.video-card strong { display: block; padding: 10px 12px 12px; font-size: 17px; }
.empty-state {
  min-height: 390px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  text-align: center;
  padding: 35px;
}
.empty-icon { font-size: 78px; }
.empty-state h2 { margin: 8px 0; color: #783362; font-size: 34px; }

.video-mode {
  padding: 0;

  background: #111;
}
.video-title {
  position: absolute;
  z-index: 11;

  left: 168px;
  right: 84px;

  font-weight: 900;

}
.video-player-stage {
  position: absolute;
  top: 76px;
  right: 14px;
  bottom: 98px;
  left: 14px;

}
.youtube-player-host,
.youtube-player-host iframe {
  display: block;
  width: 100% !important;
  height: 100% !important;
  border: 0;
  background: #000;
}
.video-loading {
  display: flex;
  width: 100%;
  height: 100%;
  align-items: center;
  justify-content: center;
  color: #fff;

}
.video-control-bar {
  position: absolute;
  z-index: 15;
  right: 12px;
  bottom: 12px;
  left: 12px;
  height: 74px;
  display: flex;
  align-items: stretch;
  justify-content: center;
  gap: 9px;
}
.video-control {
  min-width: 128px;
  height: 64px;
  padding: 0 16px;
  border: 0;
  border-radius: 20px;
  color: #fff;
  background: #675379;

  font-size: 18px;
  font-weight: 900;
}
.video-control.primary { background: #e84f99; }
.video-control.small-control { min-width: 104px; }
.video-control.big-view-control { background: #8c56c5; }
.video-control:disabled { opacity: .42; }
.video-back-button {
  position: absolute;
  z-index: 16;
  top: 14px;
  left: 16px;
  min-width: 132px;
  height: 50px;
  padding: 0 18px;
  border: 0;
  border-radius: 25px;
  color: #fff;
  background: #8c56c5;
  box-shadow: 0 6px 15px rgba(47,24,62,.28);
  font-size: 19px;
  font-weight: 900;
}
.modal.video-big-view {
  padding: 0;
  background: #111;
}
.modal.video-big-view .modal-panel {
  width: 100%;
  max-width: none;
  height: 100%;
  max-height: none;
  border: 0;
  border-radius: 0;
}
.modal.video-big-view .video-player-stage {
  top: 68px;
  right: 6px;
  bottom: 92px;
  left: 6px;
  border-radius: 0;
}

.dressup-layout {
  min-height: 500px;
  display: flex;
  gap: 28px;
  align-items: center;
  justify-content: center;
}
.doll-stage {
  position: relative;
  width: 320px;
  height: 470px;
  border-radius: 34px;
  overflow: hidden;
  background: linear-gradient(#dff7ff 0%, #f7e5ff 58%, #ffe7f3 100%);
  box-shadow: inset 0 0 0 5px rgba(255,255,255,.7), 0 12px 25px rgba(76,40,81,.13);
}
.doll-stage:before {
  content: "✦  ✧  ✦";
  position: absolute;
  top: 22px;
  left: 0;
  right: 0;
  color: rgba(231,85,156,.52);
  text-align: center;
  font-size: 26px;
  letter-spacing: 16px;
}
.doll {
  position: absolute;
  left: 50%;
  top: 58px;
  width: 180px;
  height: 380px;
  transform: translateX(-50%);
}
.doll-hair { position:absolute; left:43px; top:0; width:95px; height:115px; border-radius:48px 48px 40px 40px; background:#9a5a30; }
.doll-head { position:absolute; left:59px; top:22px; width:63px; height:78px; border-radius:45% 45% 48% 48%; background:#f5c6a9; box-shadow: inset 0 -5px 0 rgba(209,132,112,.12); }
.doll-face:before, .doll-face:after { content:""; position:absolute; top:52px; width:7px; height:9px; border-radius:50%; background:#4f3141; }
.doll-face:before { left:74px; } .doll-face:after { right:74px; }
.doll-smile { position:absolute; left:84px; top:75px; width:16px; height:8px; border-bottom:3px solid #b55a69; border-radius:50%; }
.doll-neck { position:absolute; left:80px; top:95px; width:23px; height:24px; background:#f5c6a9; }
.doll-top { position:absolute; left:48px; top:111px; width:87px; height:89px; border-radius:24px 24px 15px 15px; background:#ff77b5; z-index:2; box-shadow: inset 0 4px 0 rgba(255,255,255,.28); }
.doll-arm { position:absolute; top:116px; width:23px; height:142px; border-radius:14px; background:#f5c6a9; }
.doll-arm.left { left:25px; transform:rotate(8deg); } .doll-arm.right { right:24px; transform:rotate(-8deg); }
.doll-skirt { position:absolute; left:24px; top:182px; width:136px; height:135px; clip-path: polygon(27% 0,73% 0,100% 100%,0 100%); background:#9158c7; z-index:3; box-shadow: inset 0 6px 0 rgba(255,255,255,.22); }
.doll-leg { position:absolute; top:306px; width:25px; height:72px; border-radius:10px; background:#f5c6a9; }
.doll-leg.left { left:59px; } .doll-leg.right { right:59px; }
.doll-shoe { position:absolute; top:366px; width:42px; height:18px; border-radius:15px 15px 5px 5px; background:#e84394; }
.doll-shoe.left { left:43px; } .doll-shoe.right { right:42px; }
.accessory { position:absolute; z-index:6; display:none; }
.accessory.show { display:block; }
.crown { left:68px; top:-15px; font-size:48px; }
.bow { left:113px; top:20px; font-size:35px; }
.starwand { right:-4px; top:180px; font-size:49px; transform:rotate(-12deg); }

.controls-panel {
  width: 48%;
  min-width: 330px;
}
.controls-panel h2 { margin: 0 0 8px; color:#753263; font-size:34px; }
.control-label { margin: 18px 0 9px; color:#86617e; font-size:16px; font-weight:900; }
.swatches { display:flex; flex-wrap:wrap; gap:10px; }
.swatch {
  width: 52px;
  height: 52px;
  border: 4px solid #fff;
  border-radius: 50%;
  box-shadow: 0 4px 10px rgba(73,34,69,.18);
}
.option-row { display:flex; flex-wrap:wrap; gap:10px; }
.option-button, .big-action {
  border:0;
  border-radius:16px;
  padding:13px 17px;
  color:#6d2d5c;
  background:#f4e8f4;
  font-weight:900;
  box-shadow:0 5px 12px rgba(81,36,76,.1);
}
.big-action { color:#fff; background:linear-gradient(145deg,#ff81bd,#e9559d); font-size:18px; }

.story-box {

.story-actions { display:flex; gap:13px; }

.canvas-wrap {

  flex-direction:column;
  align-items:center;

.dance-state { font-size:42px; font-weight:1000; }
.dance-time { margin-top:8px; font-size:28px; font-weight:800; }

.breath-cloud:before, .breath-cloud:after { content:""; position:absolute; border-radius:50%; background:#fff; }

.parent-panel { padding-bottom:30px; }

}

.parent-actions { display:flex; gap:10px; flex-wrap:wrap; }
.danger-action { background:#8b6a83; }

.toast {
  position:fixed;
  z-index:100;
  left:50%;
  bottom:35px;
  transform:translateX(-50%);
  min-width:260px;
  max-width:80%;

  <script>
(function () {
  'use strict';

  var config = window.JANA_HUB_CONFIG || {};
  var modal = document.getElementById('modal');
  var modalContent = document.getElementById('modalContent');
  var closeModalButton = document.getElementById('closeModal');
  var toast = document.getElementById('toast');
  var parentTrigger = document.getElementById('parentTrigger');
  var parentHoldTimer = null;
  var danceTimer = null;
  var breathTimer = null;
  var currentSpeech = null;
  var youtubePlayer = null;
  var youtubeApiLoading = false;
  var youtubeApiCallbacks = [];

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function loadSettings() {
    var saved = null;
    try { saved = JSON.parse(localStorage.getItem('janaHubSettings') || 'null'); } catch (e) { saved = null; }
    if (!saved) {
      saved = {
        parentPin: config.defaultParentPin || '2468',
        videos: config.initialVideos || []
      };
      saveSettings(saved);
    }
    if (!saved.videos) { saved.videos = []; }
    return saved;
  }

  function saveSettings(settings) {
    try { localStorage.setItem('janaHubSettings', JSON.stringify(settings)); } catch (e) {}
  }

  function showToast(message) {
    toast.textContent = message;
    toast.classList.remove('hidden');
    window.setTimeout(function () { toast.classList.add('hidden'); }, 2200);
  }

  function setGreeting() {
    var hour = new Date().getHours();
    var word = 'Hello';
    if (hour < 12) { word = 'Good morning'; }
    else if (hour < 18) { word = 'Good afternoon'; }
    else { word = 'Good evening'; }
    document.getElementById('greeting').textContent = word + ', ' + (config.childName || 'Jana') + '!';

    var messages = [
      'You make today sparkle.',
      'Kind hearts make magic.',
      'Your imagination is a superpower.',
      'You are loved to the moon and back.',
      'Small smiles make big sunshine.'
    ];
    document.getElementById('kindMessage').textContent = messages[new Date().getDate() % messages.length];
  }

  function openModal(html) {
    stopActiveActivities();
    modalContent.className = 'modal-content';
    modalContent.innerHTML = html;
    modal.classList.remove('hidden');
  }

  function closeModal() {
    stopActiveActivities();
    modal.classList.remove('video-big-view');
    modal.classList.add('hidden');
    modalContent.className = 'modal-content';
    modalContent.innerHTML = '';
  }

  function destroyYouTubePlayer() {
    if (youtubePlayer && typeof youtubePlayer.destroy === 'function') {
      try { youtubePlayer.destroy(); } catch (e) {}
    }
    youtubePlayer = null;
  }

  function stopActiveActivities() {
    destroyYouTubePlayer();
    modal.classList.remove('video-big-view');
    if (danceTimer) { clearInterval(danceTimer); danceTimer = null; }
    if (breathTimer) { clearTimeout(breathTimer); breathTimer = null; }
    if (window.speechSynthesis) { window.speechSynthesis.cancel(); }
    currentSpeech = null;
  }

  function ensureYouTubeApi(callback) {
    if (window.YT && window.YT.Player) {
      callback();
      return;
    }

    youtubeApiCallbacks.push(callback);
    if (youtubeApiLoading) { return; }
    youtubeApiLoading = true;

    var previousReady = window.onYouTubeIframeAPIReady;
    window.onYouTubeIframeAPIReady = function () {
      youtubeApiLoading = false;
      if (typeof previousReady === 'function') {
        try { previousReady(); } catch (e) {}
      }
      var callbacks = youtubeApiCallbacks.slice(0);
      youtubeApiCallbacks = [];
      for (var i = 0; i < callbacks.length; i++) {
        try { callbacks[i](); } catch (e) {}
      }
    };

    var script = document.createElement('script');
    script.id = 'youtubeIframeApi';
    script.src = 'https://www.youtube.com/iframe_api';
    script.onerror = function () {
      youtubeApiLoading = false;
      youtubeApiCallbacks = [];
      showToast('The video controls could not load. Check Wi-Fi and try again.');
    };
    document.head.appendChild(script);
  }

  closeModalButton.addEventListener('click', closeModal);

  var cards = document.querySelectorAll('[data-open]');
  for (var i = 0; i < cards.length; i++) {
    cards[i].addEventListener('click', function () {
      var target = this.getAttribute('data-open');
      if (target === 'theatre') { showTheatre(); }
      if (target === 'dressup') { showDressup(); }
      if (target === 'stories') { showStories(); }
      if (target === 'colour') { showColour(); }
      if (target === 'dance') { showDance(); }
      if (target === 'calm') { showCalm(); }
    });
  }

  function extractYouTubeId(value) {
    var text = String(value || '').trim();
    if (/^[A-Za-z0-9_-]{11}$/.test(text)) { return text; }
    var patterns = [
      /[?&]v=([A-Za-z0-9_-]{11})/,
      /youtu\.be\/([A-Za-z0-9_-]{11})/,
      /youtube\.com\/shorts\/([A-Za-z0-9_-]{11})/,
      /youtube(?:-nocookie)?\.com\/embed\/([A-Za-z0-9_-]{11})/
    ];
    for (var i = 0; i < patterns.length; i++) {
      var match = text.match(patterns[i]);
      if (match) { return match[1]; }
    }
    return '';
  }

  function showTheatre() {
    var settings = loadSettings();
    if (!settings.videos.length) {
      openModal(
        '<div class="empty-state">' +
          '<div class="empty-icon">🏰</div>' +
          '<h2 id="modalTitle">Your theatre is getting ready</h2>' +
          '<p>Mum will choose the Barbie doll videos that are safe for you. Try Dress-Up Studio while you wait!</p>' +
        '</div>'
      );
      return;
    }

    var html = '<h2 id="modalTitle" class="modal-heading">Barbie Doll Theatre</h2>' +
      '<p class="modal-subtitle">Marli chose every video on this shelf. Hold the heart to change the list.</p><div class="video-grid">';
    for (var i = 0; i < settings.videos.length; i++) {
      var video = settings.videos[i];
      var id = escapeHtml(video.id);
      html += '<button class="video-card" data-video-id="' + id + '" data-video-title="' + escapeHtml(video.title || ('Video ' + (i + 1))) + '">' +
        '<img src="https://img.youtube.com/vi/' + id + '/hqdefault.jpg" alt="">' +
        '<strong>' + escapeHtml(video.title || ('Magic video ' + (i + 1))) + '</strong></button>';
    }
    html += '</div>';
    openModal(html);

    var videoButtons = modalContent.querySelectorAll('[data-video-id]');
    for (var j = 0; j < videoButtons.length; j++) {
      videoButtons[j].addEventListener('click', function () {
        playVideo(this.getAttribute('data-video-id'), this.getAttribute('data-video-title'));
      });
    }
  }

  function playVideo(id, title) {
    var safeId = String(id || '').replace(/[^A-Za-z0-9_-]/g, '');
    destroyYouTubePlayer();
    modal.classList.remove('video-big-view');
    modalContent.className = 'modal-content video-mode';
    modalContent.innerHTML =
      '<button id="backToShelf" class="video-back-button" type="button">&#8249; Videos</button>' +
      '<div class="video-title">' + escapeHtml(title || 'Barbie video') + '</div>' +
      '<div class="video-player-stage">' +
        '<div id="youtubePlayer" class="youtube-player-host"><div class="video-loading">Loading the magic screen…</div></div>' +
      '</div>' +
      '<div class="video-control-bar">' +
        '<button id="videoPlay" class="video-control primary" type="button" disabled>▶ Play</button>' +
        '<button id="videoPause" class="video-control" type="button" disabled>Ⅱ Pause</button>' +
        '<button id="videoBack10" class="video-control small-control" type="button" disabled>↶ 10s</button>' +
        '<button id="videoForward10" class="video-control small-control" type="button" disabled>10s ↷</button>' +
        '<button id="videoBigView" class="video-control big-view-control" type="button">⛶ Big Screen</button>' +
      '</div>';

    document.getElementById('backToShelf').addEventListener('click', showTheatre);
    document.getElementById('videoBigView').addEventListener('click', function () {
      modal.classList.toggle('video-big-view');
      this.textContent = modal.classList.contains('video-big-view') ? '↙ Normal View' : '⛶ Big Screen';
    });

    ensureYouTubeApi(function () {
      var host = document.getElementById('youtubePlayer');
      if (!host) { return; }
      youtubePlayer = new window.YT.Player('youtubePlayer', {
        width: '100%',
        height: '100%',
        videoId: safeId,
        playerVars: {
          autoplay: 0,
          controls: 0,
          disablekb: 1,
          fs: 0,
          playsinline: 1,
          rel: 0,
          modestbranding: 1
        },
        events: {
          onReady: function () {
            enableVideoControls();
          },
          onError: function () {
            showToast('That YouTube video could not be played.');
          }
        }
      });
    });
  }

  function enableVideoControls() {
    var playButton = document.getElementById('videoPlay');
    var pauseButton = document.getElementById('videoPause');
    var backButton = document.getElementById('videoBack10');
    var forwardButton = document.getElementById('videoForward10');
    if (!playButton || !youtubePlayer) { return; }

    playButton.disabled = false;
    pauseButton.disabled = false;
    backButton.disabled = false;
    forwardButton.disabled = false;

    playButton.addEventListener('click', function () {
      if (youtubePlayer && youtubePlayer.playVideo) { youtubePlayer.playVideo(); }
    });
    pauseButton.addEventListener('click', function () {
      if (youtubePlayer && youtubePlayer.pauseVideo) { youtubePlayer.pauseVideo(); }
    });
    backButton.addEventListener('click', function () {
      if (!youtubePlayer || !youtubePlayer.getCurrentTime || !youtubePlayer.seekTo) { return; }
      youtubePlayer.seekTo(Math.max(0, youtubePlayer.getCurrentTime() - 10), true);
    });
    forwardButton.addEventListener('click', function () {
      if (!youtubePlayer || !youtubePlayer.getCurrentTime || !youtubePlayer.seekTo) { return; }
      youtubePlayer.seekTo(youtubePlayer.getCurrentTime() + 10, true);
    });
  }

  function showDressup() {
    openModal(
      '<div class="dressup-layout">' +
        '<div class="doll-stage"><div class="doll">' +
          '<div class="doll-hair"></div><div class="doll-head"></div><div class="doll-face"></div><div class="doll-smile"></div><div class="doll-neck"></div>' +
          '<div class="doll-arm left"></div><div class="doll-arm right"></div><div id="dollTop" class="doll-top"></div><div id="dollSkirt" class="doll-skirt"></div>' +
          '<div class="doll-leg left"></div><div class="doll-leg right"></div><div class="doll-shoe left"></div><div class="doll-shoe right"></div>' +
          '<div id="accCrown" class="accessory crown">👑</div><div id="accBow" class="accessory bow">🎀</div><div id="accWand" class="accessory starwand">🪄</div>' +
        '</div></div>' +
        '<div class="controls-panel"><h2 id="modalTitle">Dress-Up Studio</h2>' +
          '<div class="control-label">Choose a top</div><div id="topColours" class="swatches"></div>' +
          '<div class="control-label">Choose a skirt</div><div id="skirtColours" class="swatches"></div>' +
          '<div class="control-label">Add something sparkly</div><div class="option-row">' +
            '<button class="option-button" data-acc="accCrown">👑 Crown</button>' +
            '<button class="option-button" data-acc="accBow">🎀 Bow</button>' +
            '<button class="option-button" data-acc="accWand">🪄 Wand</button>' +
          '</div><div style="margin-top:22px"><button id="surpriseOutfit" class="big-action">✨ Surprise me!</button></div>' +
        '</div>' +
      '</div>'
    );

    var colours = ['#ff6fb1','#a45ed3','#50b7e8','#ffd34f','#62cf9b','#ff875e'];
    addSwatches('topColours', 'dollTop', colours);
    addSwatches('skirtColours', 'dollSkirt', colours.slice().reverse());

    var accButtons = modalContent.querySelectorAll('[data-acc]');
    for (var i = 0; i < accButtons.length; i++) {
      accButtons[i].addEventListener('click', function () {
        document.getElementById(this.getAttribute('data-acc')).classList.toggle('show');
        happyChime();
      });
    }

    document.getElementById('surpriseOutfit').addEventListener('click', function () {
      document.getElementById('dollTop').style.background = colours[Math.floor(Math.random() * colours.length)];
      document.getElementById('dollSkirt').style.background = colours[Math.floor(Math.random() * colours.length)];
      var accessories = ['accCrown','accBow','accWand'];
      for (var i = 0; i < accessories.length; i++) { document.getElementById(accessories[i]).classList.remove('show'); }
      document.getElementById(accessories[Math.floor(Math.random() * accessories.length)]).classList.add('show');
      happyChime();
    });
  }

  function addSwatches(containerId, targetId, colours) {
    var container = document.getElementById(containerId);
    for (var i = 0; i < colours.length; i++) {
      var button = document.createElement('button');
      button.className = 'swatch';
      button.style.background = colours[i];
      button.setAttribute('data-colour', colours[i]);
      button.addEventListener('click', function () {
        document.getElementById(targetId).style.background = this.getAttribute('data-colour');
        tinyPop();
      });
      container.appendChild(button);
    }
  }

  function randomStory() {
    var heroes = ['Jana', 'a brave fashion doll', 'a tiny pink dragon', 'a singing puppy', 'a glittery unicorn'];
    var places = ['the rainbow castle', 'a secret dollhouse', 'the cloud garden', 'the moonlight dance hall', 'a village made of cupcakes'];
    var helpers = ['a friendly butterfly', 'a talking handbag', 'a clever kitten', 'a sparkling fairy', 'a shy little pony'];
    var quests = ['find the missing golden shoe', 'prepare a surprise party', 'teach the stars a new dance', 'return a magic crown', 'paint a grey day with bright colours'];
    return heroes[Math.floor(Math.random()*heroes.length)] + ' travelled to ' + places[Math.floor(Math.random()*places.length)] + ', where ' + helpers[Math.floor(Math.random()*helpers.length)] + ' helped her ' + quests[Math.floor(Math.random()*quests.length)] + '. And because she was brave and kind, everyone celebrated with music, hugs and strawberry cake!';
  }

  function showStories() {
    var story = randomStory();
    openModal(
      '<div class="story-box"><div class="story-icon">📖✨</div>' +
      '<h2 id="modalTitle" class="modal-heading">Story Sparkles</h2>' +
      '<div id="storyText" class="story-text">' + escapeHtml(story) + '</div>' +
      '<div class="story-actions"><button id="newStory" class="big-action">✨ New story</button>' +
      '<button id="readStory" class="option-button">🔊 Read to me</button></div></div>'
    );
    document.getElementById('newStory').addEventListener('click', function () {
      var next = randomStory();
      document.getElementById('storyText').textContent = next;
      happyChime();
    });
    document.getElementById('readStory').addEventListener('click', function () {
      var button = this;
      var synth = window.speechSynthesis || window.webkitSpeechSynthesis;
      var Utterance = window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance;
      var storyElement = document.getElementById('storyText');

      if (!synth || !Utterance || !storyElement) {
        showToast('Reading aloud is not available on this iPad.');
        return;
      }

      try {
        if (synth.speaking || synth.pending || currentSpeech) {
          synth.cancel();
        }

        currentSpeech = new Utterance(storyElement.textContent);
        currentSpeech.lang = 'en-US';
        currentSpeech.rate = 0.82;
        currentSpeech.pitch = 1.05;
        currentSpeech.volume = 1;

        if (typeof synth.getVoices === 'function') {
          var voices = synth.getVoices() || [];
          for (var i = 0; i < voices.length; i++) {
            if (/^en[-_]/i.test(voices[i].lang || '')) {
              currentSpeech.voice = voices[i];
              break;
            }
          }
        }

        button.disabled = true;
        button.textContent = '🔊 Reading…';

        currentSpeech.onstart = function () {
          button.disabled = true;
          button.textContent = '🔊 Reading…';
        };

        currentSpeech.onend = function () {
          button.disabled = false;
          button.textContent = '🔊 Read to me';
          currentSpeech = null;
        };

        currentSpeech.onerror = function () {
          button.disabled = false;
          button.textContent = '🔊 Read to me';
          currentSpeech = null;
          showToast('I could not read that story. Please try once more.');
        };

        /*
          Older iOS versions can ignore a new utterance when cancel() and speak()
          happen in the same instant. A short delay avoids that race.
        */
        window.setTimeout(function () {
          try {
            synth.speak(currentSpeech);
            if (synth.paused && typeof synth.resume === 'function') {
              synth.resume();
            }
            window.setTimeout(function () {
              if (synth.paused && typeof synth.resume === 'function') {
                synth.resume();
              }
            }, 250);
          } catch (speechError) {
            button.disabled = false;
            button.textContent = '🔊 Read to me';
            currentSpeech = null;
            showToast('I could not start the storyteller.');
          }
        }, 80);
      } catch (error) {
        button.disabled = false;
        button.textContent = '🔊 Read to me';
        currentSpeech = null;
        showToast('I could not start the storyteller.');
      }
    });
  }

  function showColour() {
    openModal(
      '<h2 id="modalTitle" class="modal-heading">Colour Garden</h2><p class="modal-subtitle">Draw a dress, a castle, a pet — anything you imagine.</p>' +
      '<div class="canvas-wrap"><canvas id="drawCanvas"></canvas><div id="palette" class="palette"></div></div>'
    );
    setupCanvas();
  }

  function setupCanvas() {
    var canvas = document.getElementById('drawCanvas');
    var palette = document.getElementById('palette');
    var ctx = canvas.getContext('2d');
    var currentColour = '#ef5aa4';
    var drawing = false;
    var lastX = 0;
    var lastY = 0;

    function resizeCanvas() {
      var rect = canvas.getBoundingClientRect();
      var ratio = window.devicePixelRatio || 1;
      var old = document.createElement('canvas');
      old.width = canvas.width; old.height = canvas.height;
      if (canvas.width && canvas.height) { old.getContext('2d').drawImage(canvas,0,0); }
      canvas.width = Math.floor(rect.width * ratio);
      canvas.height = Math.floor(rect.height * ratio);
      ctx = canvas.getContext('2d');
      ctx.scale(ratio, ratio);
      ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 13;
      if (old.width) { ctx.drawImage(old,0,0,old.width,old.height,0,0,rect.width,rect.height); }
    }
    window.setTimeout(resizeCanvas, 50);

    var colours = ['#ef5aa4','#9e61d2','#4db9ed','#42c78b','#ffd04a','#ff835e','#62435d','#ffffff'];
    for (var i = 0; i < colours.length; i++) {
      var sw = document.createElement('button');
      sw.className = 'swatch';
      sw.style.background = colours[i];
      sw.setAttribute('data-colour', colours[i]);
      sw.addEventListener('click', function () { currentColour = this.getAttribute('data-colour'); tinyPop(); });
      palette.appendChild(sw);
    }
    var clear = document.createElement('button'); clear.className='palette-button'; clear.textContent='🧼'; clear.title='Clear picture';
    clear.addEventListener('click', function(){ ctx.clearRect(0,0,canvas.width,canvas.height); happyChime(); });
    palette.appendChild(clear);

    function point(event) {
      var rect = canvas.getBoundingClientRect();
      var source = event.touches && event.touches.length ? event.touches[0] : event;
      return { x: source.clientX - rect.left, y: source.clientY - rect.top };
    }
    function start(event) { event.preventDefault(); drawing=true; var p=point(event); lastX=p.x; lastY=p.y; }
    function move(event) {
      if (!drawing) { return; }
      event.preventDefault();
      var p=point(event); ctx.strokeStyle=currentColour; ctx.beginPath(); ctx.moveTo(lastX,lastY); ctx.lineTo(p.x,p.y); ctx.stroke(); lastX=p.x; lastY=p.y;
    }
    function end(event) { if (event) { event.preventDefault(); } drawing=false; }
    canvas.addEventListener('touchstart', start, {passive:false});
    canvas.addEventListener('touchmove', move, {passive:false});
    canvas.addEventListener('touchend', end, {passive:false});
    canvas.addEventListener('mousedown', start);
    canvas.addEventListener('mousemove', move);
    canvas.addEventListener('mouseup', end);
    canvas.addEventListener('mouseleave', end);
  }

  function showDance() {
    openModal(
      '<div class="dance-room"><h2 id="modalTitle" class="modal-heading">Dance & Freeze</h2>' +
      '<div id="danceOrb" class="dance-orb"><div id="danceState" class="dance-state">READY?</div><div id="danceTime" class="dance-time">30</div></div>' +
      '<div class="dance-controls"><button id="danceStart" class="big-action">▶ Start</button><button id="danceReset" class="option-button">↺ Again</button></div>' +
      '<p class="modal-subtitle" style="margin:18px 0 0">Dance when it says DANCE. Freeze like a statue when it says FREEZE!</p></div>'
    );
    var remaining = 30;
    var running = false;
    var phase = 'DANCE';
    var switchAt = 4;
    var stateEl = document.getElementById('danceState');
    var timeEl = document.getElementById('danceTime');
    function update() { timeEl.textContent = remaining; stateEl.textContent = running ? phase : 'READY?'; }
    function reset() { if(danceTimer){clearInterval(danceTimer);danceTimer=null;} remaining=30;running=false;phase='DANCE';switchAt=4;update(); }
    document.getElementById('danceStart').addEventListener('click', function () {
      if (running) { return; }
      running=true; phase='DANCE'; switchAt=3 + Math.floor(Math.random()*3); update(); happyChime();
      danceTimer=setInterval(function(){
        remaining--; switchAt--;
        if (switchAt <= 0) { phase = phase === 'DANCE' ? 'FREEZE!' : 'DANCE'; switchAt = 3 + Math.floor(Math.random()*4); phase === 'FREEZE!' ? lowBeep() : happyChime(); }
        if (remaining <= 0) { clearInterval(danceTimer);danceTimer=null;running=false;stateEl.textContent='TA-DA!';timeEl.textContent='★';happyChime();return; }
        update();
      },1000);
    });
    document.getElementById('danceReset').addEventListener('click', reset);
  }

  function showCalm() {
    openModal(
      '<div class="calm-room"><h2 id="modalTitle" class="modal-heading">Quiet Cloud</h2>' +
      '<div id="breathCloud" class="breath-cloud"></div><div id="breathInstruction" class="breath-instruction">Ready for calm?</div>' +
      '<div id="breathCount" class="breath-count">Five gentle breaths</div>' +
      '<div style="margin-top:24px"><button id="breathStart" class="big-action">☁️ Begin</button></div></div>'
    );
    document.getElementById('breathStart').addEventListener('click', function () {
      var count = 0;
      var cloud = document.getElementById('breathCloud');
      var instruction = document.getElementById('breathInstruction');
      var counter = document.getElementById('breathCount');
      this.disabled = true;
      function cycle() {
        if (count >= 5) { cloud.classList.remove('grow'); instruction.textContent='Soft and sparkly'; counter.textContent='You did it!'; happyChime(); return; }
        instruction.textContent='Breathe in…'; cloud.classList.add('grow'); counter.textContent='Breath ' + (count+1) + ' of 5';
        breathTimer=setTimeout(function(){
          instruction.textContent='Breathe out…'; cloud.classList.remove('grow');
          breathTimer=setTimeout(function(){ count++; cycle(); },4200);
        },4200);
      }
      cycle();
    });
  }

  function audioContext() {
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { return null; }
    try { return new AC(); } catch (e) { return null; }
  }
  function playTone(frequency, duration, volume) {
    var ctx = audioContext();
    if (!ctx) { return; }
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.frequency.value = frequency;
    osc.type = 'sine';
    gain.gain.value = volume || .08;
    osc.connect(gain); gain.connect(ctx.destination); osc.start();
    gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + duration);
    osc.stop(ctx.currentTime + duration);
  }
  function tinyPop(){ playTone(620,.12,.05); }
  function lowBeep(){ playTone(220,.22,.08); }
  function happyChime(){ playTone(660,.2,.06); window.setTimeout(function(){playTone(880,.28,.05);},110); }

  function startParentHold(event) {
    event.preventDefault();
    if (parentHoldTimer) { clearTimeout(parentHoldTimer); }
    parentHoldTimer = setTimeout(function () { parentHoldTimer=null; requestParentPin(); }, 3000);
  }
  function cancelParentHold(event) {
    if (event) { event.preventDefault(); }
    if (parentHoldTimer) { clearTimeout(parentHoldTimer); parentHoldTimer=null; }
  }
  parentTrigger.addEventListener('touchstart', startParentHold, {passive:false});
  parentTrigger.addEventListener('touchend', cancelParentHold, {passive:false});
  parentTrigger.addEventListener('touchcancel', cancelParentHold, {passive:false});
  parentTrigger.addEventListener('mousedown', startParentHold);
  parentTrigger.addEventListener('mouseup', cancelParentHold);
  parentTrigger.addEventListener('mouseleave', cancelParentHold);

  function requestParentPin() {
    var entered = window.prompt('Grown-up code:');
    if (entered === null) { return; }
    var settings = loadSettings();
    if (String(entered) !== String(settings.parentPin)) { showToast('That code did not match.'); return; }
    showParentPanel();
  }

  function showParentPanel() {
    var settings = loadSettings();
    var rows = '';
    for (var i=0;i<6;i++) {
      var video = settings.videos[i] || {title:'',id:''};
      rows += '<div class="parent-video-row"><input class="parent-title" placeholder="Button title" value="' + escapeHtml(video.title) + '">' +
        '<input class="parent-url" placeholder="Paste a YouTube video link" value="' + escapeHtml(video.id) + '"></div>';
    }
    openModal(
      '<div class="parent-panel"><h2 id="modalTitle" class="modal-heading">Marli&#039;s Grown-Up Controls</h2>' +
      '<p class="parent-note">This little panel prevents accidental changes by a young child; Apple supervision and Screen Time remain the real security controls.</p>' +
      '<div class="parent-section"><h3>Approved Barbie doll videos</h3><p class="parent-note">Paste individual video links, not a YouTube search page. Empty rows will be ignored.</p>' + rows + '</div>' +
      '<div class="parent-section"><h3>Change grown-up code</h3><label>New 4-digit code</label><input id="newParentPin" type="password" inputmode="numeric" maxlength="4" placeholder="Leave blank to keep current code"></div>' +
      '<div class="parent-actions"><button id="saveParent" class="big-action">Save choices</button><button id="resetHub" class="big-action danger-action">Reset hub choices</button></div></div>'
    );
    document.getElementById('saveParent').addEventListener('click', saveParentPanel);
    document.getElementById('resetHub').addEventListener('click', function () {
      if (window.confirm('Remove all approved video choices and restore the starting grown-up code?')) {
        localStorage.removeItem('janaHubSettings'); loadSettings(); closeModal(); showToast('Hub choices were reset.');
      }
    });
  }

  function saveParentPanel() {
    var settings = loadSettings();
    var titles = modalContent.querySelectorAll('.parent-title');
    var urls = modalContent.querySelectorAll('.parent-url');
    var videos = [];
    for (var i=0;i<urls.length;i++) {
      var id = extractYouTubeId(urls[i].value);
      if (id) { videos.push({ id:id, title:titles[i].value.trim() || ('Magic video ' + (videos.length+1)) }); }
    }
    var newPin = document.getElementById('newParentPin').value.trim();
    if (newPin && !/^\d{4}$/.test(newPin)) { showToast('Use exactly four numbers for the grown-up code.'); return; }
    settings.videos = videos;
    if (newPin) { settings.parentPin = newPin; }
    saveSettings(settings);
    closeModal();
    showToast('Marli’s choices are saved.');
  }

  setGreeting();
})();

  </script>
<script>
window.JANA_HUB_DIAGNOSTICS = function () {
  var settings = null;
  try { settings = JSON.parse(localStorage.getItem('janaHubSettings') || 'null'); } catch (e) {}
  return {
    build: window.JANA_HUB_BUILD,
    savedVideoCount: settings && settings.videos ? settings.videos.length : 0,
    speechSynthesis: !!(window.speechSynthesis || window.webkitSpeechSynthesis),
    utteranceConstructor: !!(window.SpeechSynthesisUtterance || window.webkitSpeechSynthesisUtterance)
  };
};
</script>
